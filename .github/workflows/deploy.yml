name: Deploy To EC2

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bullpen-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bullpen-frontend:latest

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy"
          target: "/home/${{ secrets.EC2_USER }}/bullpen-deploy"
          overwrite: true

      - name: Run deployment on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/bullpen-deploy
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }}
            SSM_ENABLED=${{ secrets.SSM_ENABLED }}
            SSM_PARAMETER_PATH=${{ secrets.SSM_PARAMETER_PATH }}
            SSM_PARAMETER_NAMES=${{ secrets.SSM_PARAMETER_NAMES }}
            SSM_WITH_DECRYPTION=${{ secrets.SSM_WITH_DECRYPTION }}
            SSM_OVERRIDE_ENV=${{ secrets.SSM_OVERRIDE_ENV }}
            KBO_ROSTER_ENABLED=${{ secrets.KBO_ROSTER_ENABLED }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            S3_PREDICTION_PREFIX=${{ secrets.S3_PREDICTION_PREFIX }}
            CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}
            EOF
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif docker-compose --version >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Docker Compose is not installed on EC2."
              exit 1
            fi
            docker container prune -f || true
            docker image prune -af || true
            docker volume prune -f || true
            $COMPOSE_CMD -f docker-compose.prod.yml pull
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --remove-orphans

            # Optional: keep HTTPS config/certs in sync on every deploy.
            if [ -n "${{ secrets.HTTPS_DOMAIN }}" ] && [ -n "${{ secrets.HTTPS_EMAIL }}" ]; then
              chmod +x deploy/scripts/enable-https.sh
              if ! ./deploy/scripts/enable-https.sh "${{ secrets.HTTPS_DOMAIN }}" "${{ secrets.HTTPS_EMAIL }}"; then
                echo "HTTPS automation failed; deployment will continue with current containers."
              fi
            else
              echo "HTTPS_DOMAIN/HTTPS_EMAIL not set; skipping HTTPS automation."
            fi
